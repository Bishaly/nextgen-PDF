
name: Build NextGen PDF Studio for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Handle Missing Optional Icons
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); if(!fs.existsSync('build/icon.ico')) { delete p.build.win.icon; delete p.build.nsis.installerIcon; delete p.build.nsis.uninstallerIcon; delete p.build.portable.splashImage; p.build.files=p.build.files.filter(x=>x!=='build/icon.*'); fs.writeFileSync('package.json',JSON.stringify(p,null,2)); console.log('Using default application icon'); }"

      - name: Build Windows EXE
        run: npm run dist:win

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-PDF-Studio-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
